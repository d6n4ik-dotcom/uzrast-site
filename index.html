<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UZ RUST X2</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:#000;
color:white;
overflow:hidden;
}

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url('https://images6.alphacoders.com/909/909641.jpg');
background-size:cover;
background-position:center;
filter:brightness(0.3);
z-index:-1;
}

.center{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

h1{
font-size:80px;
margin-bottom:20px;
font-weight:bold;
}

p{
font-size:32px;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:18px 50px;
background:#00b140;
color:white;
font-size:30px;
font-weight:bold;
text-decoration:none;
border-radius:14px;
transition:0.3s;
}

.btn:hover{
background:#00d84f;
transform:scale(1.05);
}

.info{
margin-top:30px;
font-size:26px;
opacity:0.9;
}

.discord{
margin-top:20px;
font-size:22px;
color:#ccc;
}
</style>
</head>

<div class="bg"></div>

<div class="center">

<h1>UZ RAST TEST X2</h1>

CONNECT

</div>

uzrast.uz
</div>
